<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio of Doom</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Share Tech Mono', monospace;
      background: radial-gradient(circle at center, #000000 0%, #0a0a0a 100%);
      color: #00ffe0;
      text-align: center;
      overflow-x: hidden;
    }
    header {
      padding: 80px 20px;
      background: url('https://www.transparenttextures.com/patterns/stardust.png');
      background-size: cover;
      box-shadow: 0 0 20px #00ffe0;
    }
    h1 {
      font-size: 3em;
      text-shadow: 0 0 20px #00ffe0;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.2em;
      color: #ccc;
    }
    .mutavi-link {
      display: inline-block;
      margin-top: 40px;
      padding: 12px 24px;
      background: #00ffe0;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 0 10px #00ffe0;
      transition: transform 0.2s ease;
    }
    .mutavi-link:hover {
      transform: scale(1.05);
      background: #00ccaa;
    }
    footer {
      margin-top: 60px;
      padding: 20px;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to the Doom</h1>
    <p>“Mutavi is HIM.”</p>
    <a class="mutavi-link" href="https://github.com/joshisnthere" target="_blank">Visit Mutavis Portfolio</a>
  </header>

  <footer>
    © Joshua — Portfolio of Doom 2025 - Carlynn is stupid
  </footer>
</body>
</html>
